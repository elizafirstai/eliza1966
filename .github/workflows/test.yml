name: 1966 transcript

on:
  push:
  pull_request:

jobs:
  cacm:
    name: ELIZA answers like the 1966 paper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node --check bridge/server.js && node --check bridge/session.js && node --check bridge/ctss.js
